name: Verify
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'artifacts/**', 'apk/**', 'README.md', 'AGENTS.md']
  pull_request:
    paths-ignore: ['docs/**', 'artifacts/**', 'apk/**', 'README.md', 'AGENTS.md']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install -r services/api/requirements.lock
      - run: python -m pip install --no-deps -e './services/api[test]'
      - run: python -m pytest services/api/tests -q
      - run: python -m unittest discover -s scripts/tests -p test_story_demo.py
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/automotive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDemoDebugUnitTest assembleDemoDebug assembleLiveDebug
